name: M14 - Original NSO 0xC7 registry vtable resolution survey

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_item_registry_vtables.py"
      - ".github/workflows/unpack-m14-native-item-vtable.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m14-vtables
  cancel-in-progress: false

jobs:
  trace-original-vtables:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_item_registry_vtables.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original NSO LZ4 and ARM64 disassembler
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Test synthetic NSO MOD0, AArch64 RELA, reject forged originals
        run: python -m Scripts.resources.trace_native_item_registry_vtables --self-test
      - name: Scan exact ExeFS vtables and relocation pointers
        run: python -m Scripts.resources.trace_native_item_registry_vtables
      - name: Ensure vtable-to-item provenance is not falsely claimed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M14/registry_vtable_candidates.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["sources"]["main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["sources"]["item_sha256"]=="2a2dbc88715dc76410cef495d418613456c0c4fa7b7d719e7b37709ad53e1b6f"
          assert j["registry_index"]=="0xc7" and j["virtual_method_offset"]=="0x30"
          assert not j["registry_to_concrete_vtable_confirmed"]
          assert not j["virtual_method_to_original_item_record_confirmed"]
          assert not j["return_object_plus8_to_00983_68_stride_confirmed"]
          print("PASS original source hashes and false-positive guard")
          PY
      - name: Commit machine-readable evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M14
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m14): original NSO MOD0 and vtable relocation candidates"
          for n in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
