name: M10 - Original ExeFS item type and quantity instruction candidates

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/probe_native_item_assembly.py"
      - ".github/workflows/unpack-m10-native-item-assembly.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-2.0.1-native-items-m10
  cancel-in-progress: false

jobs:
  static-item-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout only original ExeFS and analysis tools
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/probe_native_item_assembly.py
            Scripts/resources/trace_native_species_item_callers.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disassembler and bounded NSO LZ4 decoder
        run: python -m pip install "capstone>=5,<6" "lz4>=4,<5"
      - name: Synthetic instruction decoding tests
        run: python Scripts/resources/probe_native_item_assembly.py --self-test
      - name: Disassemble exact native 2.0.1 executable for evidence candidates
        run: python Scripts/resources/probe_native_item_assembly.py
      - name: Verify raw-data evidence is never promoted to a confirmed item property
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/item_assembly_candidates.json")
          r=json.loads(path.read_text(encoding="utf-8"))
          assert r["source_sha256"] == "8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert r["nso_format"]=="NSO0"
          assert r["text_bytes"]>40000000
          assert not r["official_category_enum_confirmed"]
          assert not r["stack_merge_99_confirmed"]
          assert not r["per_item_stack_override_confirmed"]
          print("Source hash and evidence boundary PASS")
          PY
      - name: Commit exact original-address evidence to 2.0.1_unpack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "data(m10): save original NSO item type and stack boundary candidates"
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
