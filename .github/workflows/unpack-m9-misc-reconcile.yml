name: M9 - Reconcile all 3930 source-linked native miscellaneous PNGs

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/reconcile_native_misc_batches.py"
      - "tests/test_reconcile_native_misc_batches.py"
      - ".github/workflows/unpack-m9-misc-reconcile.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m9-reconcile-misc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exhaustive-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only source index, Python scripts and synthetic tests
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/export_native_misc_batches.py
            Scripts/resources/reconcile_native_misc_batches.py
            Scripts/resources/export_native_misc_samples.py
            Scripts/resources/g1t_to_png.py
            Scripts/resources/crop_native_item_atlas.py
            tests/test_reconcile_native_misc_batches.py
            UnPack/2.0.1/Resources/Textures/Indexes/native_misc_texture_index.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG dependency for imported shared native extractor
        run: python -m pip install "Pillow>=11,<13"

      - name: Synthetic complete/missing-batch ledger tests
        run: python -m unittest discover -s tests -p "test_reconcile_native_misc_batches.py" -v

      - name: Sparse checkout exact 17 batch audit JSON and CSV ledgers, no PNG downloads
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
              "Scripts/resources/export_native_misc_batches.py",
              "Scripts/resources/reconcile_native_misc_batches.py",
              "Scripts/resources/export_native_misc_samples.py",
              "Scripts/resources/g1t_to_png.py",
              "Scripts/resources/crop_native_item_atlas.py",
              "tests/test_reconcile_native_misc_batches.py",
              "UnPack/2.0.1/Resources/Textures/Indexes/native_misc_texture_index.csv"
          ]
          base="UnPack/2.0.1/Resources/Textures/MiscNativeBatches"
          for i in range(17):
              paths.append(f"{base}/batch_{i:02d}/batch_audit.json")
              paths.append(f"{base}/batch_{i:02d}/misc_native_sample_manifest.csv")
          Path("/tmp/native-misc-ledgers-only.txt").write_text(
              "\n".join(paths)+"\n",encoding="utf-8")
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/native-misc-ledgers-only.txt

      - name: Verify exactly 3930 disjoint source keys, complete PNG success and original index SHA
        run: |
          python -m Scripts.resources.reconcile_native_misc_batches --require-complete
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("UnPack/2.0.1/Resources/Textures/Indexes")
          d=json.loads((root/"native_misc_png_summary.json").read_text(encoding="utf-8"))
          with (root/"native_misc_png_catalog.csv").open(encoding="utf-8",newline="") as f:
              records=list(csv.DictReader(f))
          assert d["status"]=="COMPLETE_SOURCE_COVERAGE",d
          assert d["seen_source_records"]==d["png_candidates"]==3930,d
          assert d["recorded_failure_rows"]==d["missing_source_records"]==0,d
          assert len(records)==3930
          assert len({r["png_path"] for r in records})==3930
          assert d["material_types_proven"] is False
          print("Native 2.0.1 UI/scene/material-name PNG provenance: 3930/3930, no missing source keys.")
          PY

      - name: Commit unified source evidence and 3930-entry PNG catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Textures/Indexes/native_misc_png_catalog.csv UnPack/2.0.1/Resources/Textures/Indexes/native_misc_png_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m9): reconcile 3930 native UI PNG source keys with zero missing/failed entries"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 1
          done
          exit 1
