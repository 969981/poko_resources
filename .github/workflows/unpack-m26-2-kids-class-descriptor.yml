name: M26.2 - Original KIDS 3543 array class vtable and descriptor closure

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m26_2_kids_class_descriptor_ownership.py"
      - ".github/workflows/unpack-m26-2-kids-class-descriptor.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m26-2-vtable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-original-class-vtable-descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout original ExeFS and exact bounded AArch64 verifier
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            Scripts/resources/m26_2_kids_class_descriptor_ownership.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original AArch64 source parser
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Check original KIDS getter slot and descriptor offsets
        run: python -m Scripts.resources.m26_2_kids_class_descriptor_ownership --self-test

      - name: Prove raw original BSS method table and 0x34CBB458 property descriptor read-only
        run: python -m Scripts.resources.m26_2_kids_class_descriptor_ownership

      - name: Verify static class proof does not assign game species IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M26")
          j=json.loads((p/"m26_2_class_methodtable_descriptor_summary.json").read_text(encoding="utf-8"))
          d=json.loads((p/"m26_2_class_methodtable_descriptor_evidence.json").read_text(encoding="utf-8"))
          assert j["original_class_type_hash"]=="0x9d1afa46"
          assert j["original_class_global_owner_cell"]=="0x349c2e0"
          assert j["original_class_bss_owner_initial_va"]=="0x367ad40"
          assert j["original_class_method_table_installed_at"]=="0x33135c8"
          assert j["original_class_typehash_getter_method_slot_offset"]=="0x28"
          assert j["original_class_typehash_getter"]=="0xdd1c30"
          assert j["original_property_descriptor_address"]=="0x2838834"
          assert j["original_3543_icon_source_property_hash"]=="0x34cbb458"
          assert j["original_descriptor_adrp_add_verified"]
          assert not j["game_species_ID_to_3543_array_index_proven"]
          assert not j["native_villager_ID_to_icon_source_OID_proven"]
          assert len(d["original_static_vtable"])==16
          print("PASS M26.2 original 3543 KIDS metadata closure, no game-ID promotion")
          PY

      - name: Preserve KIDS class and metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m26-2-original-3543-array-descriptor-vtable
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M26/m26_2_*
          if-no-files-found: warn

      - name: Commit class metadata static byte-chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M26/m26_2_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m26.2): original BSS KIDS type class vtable and sprite array property descriptor"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
