name: M9.12 - verified original object vptr write to descriptor callback

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m9_verified_vptr_assignments.py"
      - "tests/test_m9_verified_vptr_assignments.py"
      - ".github/workflows/unpack-m9-verified-vptr-assignments.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m9-12-vptr-assignment
  cancel-in-progress: false

jobs:
  verify-native-pointer-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/m9_verified_vptr_assignments.py
            Scripts/resources/m9_rnk_exefs_xrefs.py
            Scripts/resources/trace_native_species_item_callers.py
            tests/test_m9_verified_vptr_assignments.py
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_vptr_disassembly_windows.json
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_verified_vptr_stores.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Native instruction-level synthetic vptr tests
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_m9_verified_vptr_assignments.py' -v

      - name: Verify original object initialization and vptr+0x38 callback slot
        env:
          PYTHONPATH: "."
        run: |
          python Scripts/resources/m9_verified_vptr_assignments.py \
            --main 2.0.1/exefs/main \
            --m9-11 UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_vptr_disassembly_windows.json \
            --dest UnPack/2.0.1/Resources/Localization/M9/NameTables

      - name: Validate evidence and protect M7 FK table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_verified_vptr_stores.json')
          r=json.loads(path.read_text(encoding='utf-8'))
          report=r['report']
          assert report['original_vptr_stores_verified']==2
          assert report['descriptor_callback_table_slots_verified']==1
          assert report['verified_runtime_indirect_dispatchers']==0
          assert report['verified_native_kidsobjdb_getters']==0
          assert report['verified_scene_quest_building_m7_text_foreign_keys']==0
          a=next(x for x in r['verified_stores'] if x['site']=='candidate_object_A')
          assert a['written_pointer']==0x32fdfa0
          assert a['vtable_callback_offset']==0x38
          assert a['table_callback_pc']==0xd59420
          assert a['associated_descriptor_hash_candidate']=='0xf92c5190'
          assert all(not x['verified_script_text_fk'] for x in r['verified_stores'])
          print('M9.12 vptr and callback linkage verified')
          PY

      - name: Upload precise native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m9-12-vptr-store-and-callback
          path: UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_verified_vptr_stores.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit native proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_verified_vptr_stores.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m9.12): prove original object vptr and descriptor callback layout"
          for attempt in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
