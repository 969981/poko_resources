name: M25.5 - Restore 26 overlooked original Pokemon icon PNGs

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m25_5_recover_26_native_icon_png.py"
      - ".github/workflows/unpack-m25-5-restore-native-icon-png.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m25-5-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-original-g1t-texinfo-image-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout native source manifests and 79 reference portraits
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/m25_5_recover_26_native_icon_png.py
            Scripts/resources/g1t_to_png.py
            Scripts/resources/crop_native_item_atlas.py
            Scripts/resources/export_native_pokemon_icons.py
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_3_26_original_source_to_texture_objects.csv
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_4_26_texture_hash_rdb_provenance.csv
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M22/m22_unresolved_79_source_targets.csv
            UnPack/2.0.1/Resources/Villagers/Icons

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original BC7/G1T PNG decoder
        run: python -m pip install "Pillow>=11,<13"

      - name: Check recovery script's byte-source schema
        run: python -m Scripts.resources.m25_5_recover_26_native_icon_png --self-test

      - name: Plan only 26 original G1T and 26 original decoded TEXINFO inputs
        run: |
          python -m Scripts.resources.m25_5_recover_26_native_icon_png --plan /tmp/m25-5-sparse-patterns.txt
          echo "Original native source input count:"
          wc -l /tmp/m25-5-sparse-patterns.txt

      - name: Sparse-fetch EXACT 52 original native input blobs
        run: |
          git sparse-checkout add --stdin < /tmp/m25-5-sparse-patterns.txt
          python - <<'PY'
          from pathlib import Path
          paths=[Path(x.strip().lstrip("/")) for x in
                  Path("/tmp/m25-5-sparse-patterns.txt").read_text().splitlines()]
          assert len(paths)==52 and len(set(paths))==52
          missing=[str(p) for p in paths if not p.is_file()]
          if missing: raise ValueError(f"Original G1T/TEXINFO sparse sources absent: {missing}")
          print("Verified 52 original native input paths")
          PY

      - name: Decode all 26 original TEXINFO sprite names and G1T image bytes
        run: python -m Scripts.resources.m25_5_recover_26_native_icon_png

      - name: Verify native PNG and M22 missing portrait review provenance
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Pokemon/NativeRecoveryM25")
          s=json.loads((p/"m25_5_native_icon_export_summary.json").read_text(encoding="utf-8"))
          rows=list(csv.DictReader((p/"m25_5_native_icon_export_manifest.csv").open(encoding="utf-8",newline="")))
          assert len(rows)==26 and s["original_registry_unmatched_slots"]==26
          assert s["native_png_created"]>=1
          assert s["real_native_game_species_id_bindings_proven"]==0
          assert s["real_native_villager_id_bindings_proven"]==0
          for r in rows:
              if not r["png_file"]:continue
              f=Path(r["png_file"]); assert f.is_file()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r["png_sha256"]
              assert r["texture_name_original_texinfo"].startswith("icon_poke_")
          if s["m22_reference_portraits_rechecked"]:
              a=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_5_79_portrait_visual_crosscheck.csv")
              cross=list(csv.DictReader(a.open(encoding="utf-8",newline="")))
              assert len(cross)==79
              assert all(not r["native_villager_id_proven"] for r in cross)
          print("M25.5 real native G1T/TEXINFO PNG bytes validated")
          PY

      - name: Preserve PNG/crosswalk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-2.0.1-m25-5-recovered-26-original-pngs
          path: |
            UnPack/2.0.1/Resources/Pokemon/NativeRecoveryM25/
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_5_*
          if-no-files-found: warn
          retention-days: 21

      - name: Commit source-qualified native PNGs and review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Pokemon/NativeRecoveryM25/ UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_5_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(m25.5): restore original 2.0.1 TEXINFO G1T PNG icons and cross-check 79 missing portraits"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
