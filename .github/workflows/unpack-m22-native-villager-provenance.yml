name: M22 - Native villager source and variant reference investigation

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m22_villager_native_provenance.py"
      - ".github/workflows/unpack-m22-native-villager-provenance.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m22-villager-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-reference-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Sparse checkout native 609 Pokemon, 3930 UI PNGs, typed original KIDSOBJDB
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/m22_villager_native_provenance.py
            UnPack/2.0.1/Resources/Villagers/villager_catalog.csv
            UnPack/2.0.1/Resources/Villagers/Icons
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/native_icon_crosswalk.csv
            UnPack/2.0.1/Resources/Pokemon/NativeCandidates
            UnPack/2.0.1/Resources/Pokemon/pokemon_identity_crosswalk.csv
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M19/m19_verified_texture_object_edges.csv
            UnPack/2.0.1/Resources/Textures/MiscNativeBatches
            UnPack/2.0.1/_reports/source_coverage.json
            UnPack/2.0.1/_reports/missing_input_records.csv
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0xacd220a8.fdata/native/root_019167_50ae86ef.kidsobjdb
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0xacd220a8.fdata/native/root_053829_e2e43333.kidsobjdb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install decoded-PNG comparison dependency
        run: python -m pip install "Pillow>=11,<13"

      - name: Static parser self-tests
        run: python Scripts/resources/m22_villager_native_provenance.py --self-test

      - name: Typed KIDSOBJDB byte verification and full cross-family PNG scan
        run: python Scripts/resources/m22_villager_native_provenance.py

      - name: Validate persisted findings without invented IDs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M22")
          result=json.loads((p/"m22_summary.json").read_text(encoding="utf-8"))
          assert (result["unresolved"],result["far_visual"],result["ambiguous_visual"]) == (88,79,9)
          assert (result["far_consecutive_317_378"],result["far_scattered"]) == (62,17)
          assert result["original_fdata_coverage"]["missing_index_rows_loaded"]==6118
          assert result["other_original_png_sweep"]["other_original_pngs_swept"]==3930
          assert result["native_villager_id_semantic_bindings_verified"]==0
          refs=list(csv.DictReader((p/"m22_nine_ambiguous_native_object_refs.csv").open(encoding="utf-8",newline="")))
          assert len({x["portrait_id_pokohex"] for x in refs})==9
          assert len(refs)>9
          assert all(x["typed_object_link"]=="RAW_BYTES_CONFIRMED_SOURCE_PROPERTY_TO_TEXTURE_OID" for x in refs)
          assert all(not x["native_villager_portrait_id_verified"] for x in refs)
          rows=list(csv.DictReader((p/"m22_unresolved_79_source_targets.csv").open(encoding="utf-8",newline="")))
          assert len(rows)==79
          misc=list(csv.DictReader((p/"m22_79_other_native_png_top3.csv").open(encoding="utf-8",newline="")))
          assert len(set(x["portrait_id_pokohex"] for x in misc))==79
          print("M22 original source byte/PNG/coverage audit accepted")
          PY

      - name: Archive research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-2.0.1-m22-original-villager-source-audit
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M22/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit source-qualified provenance only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M22/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m22): original typed villager portrait source and 3930 PNG audit"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
