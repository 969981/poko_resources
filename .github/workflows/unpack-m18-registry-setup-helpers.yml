name: M18 - Audit original C6 C7 C8 setup helper implementations

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_registry_setup_helpers.py"
      - ".github/workflows/unpack-m18-registry-setup-helpers.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m18-setup
  cancel-in-progress: false

jobs:
  native-setup-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_registry_setup_helpers.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Verify native method mapping and reject forged input
        run: python -m Scripts.resources.trace_native_registry_setup_helpers --self-test
      - name: Disassemble original functions
        run: python -m Scripts.resources.trace_native_registry_setup_helpers
      - name: Validate conservative provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M18/registry_C7_setup_helpers_disassembly.json").read_text(encoding="utf-8"))
          assert j["sha256_main"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert not j["is_C7_class_constructor"]
          assert not j["proves_C7_vtable_plus30_target"]
          assert not j["proves_item_record_pointer_source"]
          print("PASS native source and evidence boundary")
          PY
      - name: Commit native helper disassembly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M18
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m18): native C6-C8 setup helpers and C7 ID accessor disassembly"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
