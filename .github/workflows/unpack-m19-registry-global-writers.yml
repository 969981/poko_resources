name: M19 - Trace original 0xC7 registry global construction writes

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_registry_global_writers.py"
      - ".github/workflows/unpack-m19-registry-global-writers.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m19-global
  cancel-in-progress: false

jobs:
  original-global-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_registry_global_writers.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LZ4 and ARM64 disassembler
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Test original NSO writer detection and forged-source rejection
        run: python -m Scripts.resources.trace_native_registry_global_writers --self-test
      - name: Analyze global registry initialization writes
        run: python -m Scripts.resources.trace_native_registry_global_writers
      - name: Confirm provenance classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M19/registry_global_writers.json").read_text(encoding="utf-8"))
          assert j["main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["registry_global"]=="0x35618f0"
          assert not j["global_writer_function_identity_proven"]
          assert not j["registered_item_class_0xc7_proven"]
          assert not j["item_record_pointer_source_proven"]
          print("PASS original source hash and conservative classification")
          PY
      - name: Commit original registry-global writer evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M19
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m19): native item registry global pointer writer evidence"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
