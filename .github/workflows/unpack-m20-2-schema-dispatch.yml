name: M20.2 - Verify original indexed Pokemon property hash array consumer

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m20_2_schema_dispatch.py"
      - ".github/workflows/unpack-m20-2-schema-dispatch.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m20-2-schema
  cancel-in-progress: false

jobs:
  verify-native-property-array:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            Scripts/resources/m20_2_schema_dispatch.py
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSO decoder and ARM64 disassembler
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Check original provenance guards
        run: python -m Scripts.resources.m20_2_schema_dispatch --self-test
      - name: Verify three-index native hash array read and output store
        run: python -m Scripts.resources.m20_2_schema_dispatch
      - name: Preserve distinction between hash read and species identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/m20_2_original_hash_array_consumer.json").read_text(encoding="utf-8"))
          assert j["original_main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["native_hash_array_base"]=="0x2830c90"
          assert j["native_schema_hash_array_read_verified"] is True
          assert len(j["indexed_property_hashes"])==3
          assert j["indexed_property_hashes"][2]["hash"]=="0x2856a1b3"
          assert not j["native_property_semantic_identity_verified"]
          assert not j["pokemon_species_id_binding_verified"]
          print("PASS native indexed field-hash consumer verified without false species IDs")
          PY
      - name: Upload exact original descriptor-index evidence
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-201-m20-2-original-schema-hash-consumer
          path: UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/m20_2_original_hash_array_consumer.json
          if-no-files-found: error
      - name: Commit evidence on unpack branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m20.2): byte-verify native indexed three-hash property descriptor"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
