name: M20.3 - Trace native property-schema function pointer table

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m20_3_schema_pointer_backrefs.py"
      - ".github/workflows/unpack-m20-3-schema-pointer-backrefs.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m20-3-schema-pointer
  cancel-in-progress: false

jobs:
  recover-schema-pointer-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            Scripts/resources/m20_3_schema_pointer_backrefs.py
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Verify strict source rejection guards
        run: python -m Scripts.resources.m20_3_schema_pointer_backrefs --self-test
      - name: Find native pointer table and original xrefs
        run: python -m Scripts.resources.m20_3_schema_pointer_backrefs
      - name: Verify immutable evidence classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/m20_3_schema_pointer_backrefs.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["native_function_pointer_cell_exact_verified"]
          assert j["schema_function_pointer_cell"]=="0x32f0ef8"
          assert j["schema_function_entry"]=="0xce854c"
          assert not j["concrete_schema_vtable_identity_verified"]
          assert not j["schema_class_constructor_verified"]
          assert not j["pokemon_species_id_verified"]
          print("PASS original pointer cell and class-identity proof separation")
          PY
      - name: Upload native pointer backreference data
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-201-m20-3-native-schema-pointer-backrefs
          path: UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/m20_3_schema_pointer_backrefs.json
          if-no-files-found: error
      - name: Commit original native pointer evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m20.3): native schema method pointer and xrefs"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
