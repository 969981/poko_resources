name: M31.5 - Canonical 628 original KIDS two-hop PNG source provenance

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m31_5_canonical_two_hop_icon_provenance.py"
      - ".github/workflows/unpack-m31-5-canonical-two-hop-assets.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m31-5-two-hop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-actual-two-hop-KIDS-source-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout original KIDS bytes and 629 M25 file hash references
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0xacd220a8.fdata/native/root_019167_50ae86ef.kidsobjdb
            UnPack/2.0.1/Resources/Pokemon/NativeRecoveryM25/m25_8_complete_native_629_kids_icon_source_index.csv
            Scripts/resources/m16_verify_pokemon_texture_kidsobjdb.py
            Scripts/resources/m31_5_canonical_two_hop_icon_provenance.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest original two-hop asset graph schema
        run: python -m Scripts.resources.m31_5_canonical_two_hop_icon_provenance --self-test

      - name: Verify original parent and child IDOK for all 628 icon sources
        run: python -m Scripts.resources.m31_5_canonical_two_hop_icon_provenance

      - name: Certify 628 original G1T and TEXINFO bindings with zero unsupported game IDs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31")
          s=json.loads((p/"m31_5_full_two_hop_source_asset_report.json").read_text(encoding="utf-8"))
          with (p/"m31_5_canonical_628_two_hop_KIDS_asset_provenance.csv").open(
              encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert s["original_KIDSOBJDB_sha256"]=="86f90b4c11da9bc2b3e28889a5090ff507f96ca713fe4fad1dd50f6f692d7541"
          assert len(rows)==s["two_hop_source_wrapper_G1T_TEXINFO_entries_verified"]==628
          assert s["parent_source_render_info_u32_both_zero_count"]==628
          assert s["wrapper_child_3rd_wrap_property_zero_count"]==628
          assert s["second_hop_wrapper_render_field_equals_M25_G1T_hash_count"]==628
          assert s["second_hop_wrapper_info_field_equals_M25_TEXINFO_hash_count"]==628
          assert s["source_and_wrapper_both_class_StaticScreenLayoutTextures"]
          assert s["old_target_texture_oid_column_semantics"]=="FIRST_HOP_WRAP_STATIC_SCREEN_LAYOUT_TEXTURES_OBJECT_HASH"
          assert all(r["verified_prior_M25_g1t_resource_file_hash"]==r["second_hop_render_state_object_hash"] and
                     r["verified_prior_M25_texinfo_resource_file_hash"]==r["second_hop_info_data_resource_hash"]
                     for r in rows)
          assert not s["native_Executed_texture_resource_loader_verified"]
          assert not s["native_species_form_ID_to_original_KIDS_OID_verified"]
          assert all(not r["native_species_ID_verified"] and not r["native_villager_ID_verified"] for r in rows)
          print("PASS original 628 two-hop object/field/file hash records: no game IDs inferred")
          PY

      - name: Upload source-qualified complete two-hop G1T TEXINFO index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m31-5-628-native-KIDS-two-hop-PNG-source-index
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_5_*
          if-no-files-found: warn

      - name: Commit 628 confirmed Source Wrapper G1T TEXINFO provenance rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_5_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m31.5): 628 original ScreenLayout two-hop source-to-wrapper-to-file hash records"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
