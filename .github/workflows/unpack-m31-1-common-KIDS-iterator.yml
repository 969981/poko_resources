name: M31.1 - Original KIDS shared virtual descriptor iterator

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m31_1_common_kids_property_enumerator.py"
      - ".github/workflows/unpack-m31-1-common-KIDS-iterator.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m31-1-vtable-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-original-vtable-call-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sparse checkout original NSO and source parsers
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            Scripts/resources/m31_1_common_kids_property_enumerator.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source NSO decoder and original ARM64 disassembler
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Selftest original KIDS virtual method dispatch anchors
        run: python -m Scripts.resources.m31_1_common_kids_property_enumerator --self-test

      - name: Verify original shared iterator and full class-specific method source
        run: python -m Scripts.resources.m31_1_common_kids_property_enumerator

      - name: Validate native vtable BLR evidence and unknown game identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31")
          s=json.loads((p/"m31_1_generic_vtable_dispatch_summary.json").read_text(encoding="utf-8"))
          j=json.loads((p/"m31_1_common_native_KIDS_enumerator_and_property_asm.json").read_text(encoding="utf-8"))
          assert s["original_main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert s["registered_classes_using_same_common_enumerator"]==2
          assert s["generic_enumerator_pc"]=="0x1fe4fa0"
          assert s["generic_enumerator_calls_virtual_slot_offset"]=="0x18"
          assert s["generic_original_source_check_instructions"]>=10
          assert {x["registered_class"] for x in j["original_property_handlers"]}=={
              "ScreenLayoutTexturePackSettings","StaticScreenLayoutTextures"}
          assert all(x["shared_enumerator_dispatches_class_specific_property_method"]
                     for x in j["original_property_handlers"])
          assert s["source_static_vtable_path_proven"]
          assert not s["runtime_common_iterator_called_with_pokemon_instance_proven"]
          assert not s["game_ID_to_texture_pack_lookup_proven"]
          assert not s["runtime_source_OID_selection_proven"]
          print("PASS original indirect AArch64 BLR through class-specific property methods")
          PY

      - name: Upload original BLR method-call and class-specific disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m31-1-original-KIDS-indirect-method-descriptor-iterator
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_1_*
          if-no-files-found: warn

      - name: Commit source-qualified original virtual dispatch evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_1_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m31.1): original shared KIDS vtable BLR dispatch to property processor methods"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
