name: M15 - Native registry 0xC7 writer and class constructor candidates

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_item_registry_slot.py"
      - ".github/workflows/unpack-m15-native-registry-slot.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m15-slot
  cancel-in-progress: false

jobs:
  native-0xc7-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_item_registry_slot.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSO and disassembly requirements
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Synthetic register slot and fake input checks
        run: python -m Scripts.resources.trace_native_item_registry_slot --self-test
      - name: Scan original NSO registry 0xc7 candidates
        run: python -m Scripts.resources.trace_native_item_registry_slot
      - name: Enforce provenance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M15/registry_slot_0xc7_original_xrefs.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["registry_index"]=="0xc7"
          assert j["registry_global_va"]=="0x35618f0"
          assert j["effective_registry_member_offset"]=="0x648"
          assert not j["proven_registry_writer"]
          assert not j["proven_registry_0xc7_class_constructor"]
          assert not j["proven_0xc7_vtable_plus30_function"]
          assert not j["proven_00983_record_pointer_source"]
          print("PASS strict native source and no false class identity")
          PY
      - name: Commit candidate disassembly and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M15
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m15): registry 0xC7 original slot writer xrefs"
          for n in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
