name: M22 - Native 983 descriptor exact pointer referents

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_983_descriptor_refs.py"
      - ".github/workflows/unpack-m22-descriptor-983-referents.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m22-desc
  cancel-in-progress: false

jobs:
  inspect-original-descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_983_descriptor_refs.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "lz4>=4,<5"
      - name: Reject forged binary and test pointer vs composite field
        run: python -m Scripts.resources.trace_native_983_descriptor_refs --self-test
      - name: Verify 983 native descriptor and inspect pointer referents
        run: python -m Scripts.resources.trace_native_983_descriptor_refs
      - name: Validate original descriptor and provenance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M22/descriptor_983_referents.json")
          j=json.loads(p.read_text(encoding="utf8"))
          assert j["original_main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert j["original_item_sha256"]=="2a2dbc88715dc76410cef495d418613456c0c4fa7b7d719e7b37709ad53e1b6f"
          assert j["descriptor_stride"]==40
          assert not j["confirmed_983_is_00983_file"]
          assert j["descriptor_983_crypto_oid_identity_proven"]
          assert j["numeric_983_not_usable_as_linkdata_file_evidence"]
          crypto={x["id"]:x for x in j["descriptors"]}
          assert crypto[983]["u64_interpretations"][0]["string"]=="md_gost12_512"
          assert crypto[982]["u64_interpretations"][0]["string"]=="md_gost12_256"
          assert crypto[984]["u64_interpretations"][0]["string"]=="id-tc26-signwithdigest"
          assert not j["confirmed_983_pointer_is_4600x68_table"]
          assert not j["confirmed_V1_V2_constructor_link"]
          print("PASS original byte provenance and unresolved identity")
          PY
      - name: Commit original descriptor pointer inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M22
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m22): inspect original 983 descriptor pointer and text referents"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
