name: M12 - Native 4600 item ID lookup and original category consumer proof

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_item_consumers.py"
      - ".github/workflows/unpack-m12-native-item-consumers.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m12-native-consumers
  cancel-in-progress: false

jobs:
  native-consumer-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_item_consumers.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M12

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original NSO segment and ARM64 disassembly dependencies
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Reject forged inputs and validate hardcoded evidence anchors
        run: python -m Scripts.resources.trace_native_item_consumers --self-test

      - name: Verify original 4600-ID loops, vtable lookup and category consumer instructions
        run: python -m Scripts.resources.trace_native_item_consumers

      - name: Enforce native loader provenance remains unresolved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M12")
          j=json.loads((base/"item_id_lookup_0x26_original_evidence.json").read_text(encoding="utf-8"))
          assert j["matched_original_instruction_count"]==23
          assert j["proven_4600_item_id_lookup_to_0x26_field_consumption"]
          assert j["item_count"]==4600 and j["item_record_stride"]==68
          assert not j["proven_00983_loader"]
          assert not j["proven_record_address_equals_item_table_base_plus_id_times_68"]
          assert not j["proven_runtime_returned_struct_matches_00983_record"]
          assert not j["enum_definition_proven"]
          print("PASS: exact original instructions, verified caller boundaries, conservative field provenance")
          PY

      - name: Commit source-backed extracted instruction evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M12
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m12): verify native 4600-ID category consumers and isolated 00983 source gap"
          for n in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
