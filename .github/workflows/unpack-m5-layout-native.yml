name: M5 - Verify Native KIDSOBJDB Layout Edges

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/verify_layout_native.py"
      - "UnPack/2.0.1/Resources/Textures/Indexes/layout-textures.tsv"
      - "UnPack/2.0.1/Resources/Textures/Indexes/item-texture-map.tsv"
      - ".github/workflows/unpack-m5-layout-native.yml"

permissions:
  contents: write

concurrency:
  group: m5-layout-fields-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-native-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            Scripts/resources/verify_layout_native.py
            UnPack/2.0.1/Resources/Textures/Indexes
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0xacd220a8.fdata/native
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x2943e4da.fdata/native
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_1/0xed66e8af.fdata/native
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xed675d0e.fdata/native

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-check KIDSOBJDB native bytes
        run: |
          python Scripts/resources/verify_layout_native.py \
            --resources UnPack/2.0.1/Resources \
            --root UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE

      - name: Audit expected M5 structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("UnPack/2.0.1/Resources/Textures/layout_field_summary.json")
          report=json.loads(f.read_text(encoding="utf-8"))
          assert report["layout_rows"] == 9427, report
          assert report["mapped_item_statuses"].get("VERIFIED_FIELDS", 0) == 3229, report
          assert report["statuses"].get("VERIFIED_FIELDS", 0) >= 9248, report
          print("Native field verification passed. Missing source records remain explicit.")
          PY

      - name: Commit native evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Textures/layout_field_audit.csv UnPack/2.0.1/Resources/Textures/layout_field_summary.json
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "data(m5): publish native KIDSOBJDB field audit and missing inputs"
          for n in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
