name: M9.19 - specific owner callback vptr base and x3 trace

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m9_owner_callback_vptr_bases.py"
      - "tests/test_m9_owner_callback_vptr_bases.py"
      - ".github/workflows/unpack-m9-owner-callback-vptr-bases.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m9-19-owner-vptr
  cancel-in-progress: false

jobs:
  exact-callback-vptr-base-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m9_rnk_exefs_xrefs.py
            Scripts/resources/m9_owner_callback_vptr_bases.py
            tests/test_m9_owner_callback_vptr_bases.py
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_two_callback_pointer_tables.json
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_callback_vptr_base_probes.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Verify derived vptr hypothesis and source ARM64 address construction
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_m9_owner_callback_vptr_bases.py' -v

      - name: Native ExeFS exact callback table vptr candidate xrefs
        env:
          PYTHONPATH: "."
        run: |
          python Scripts/resources/m9_owner_callback_vptr_bases.py \
            --main 2.0.1/exefs/main \
            --callback-evidence UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_two_callback_pointer_tables.json \
            --dest UnPack/2.0.1/Resources/Localization/M9/NameTables

      - name: Validate typed evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_callback_vptr_base_probes.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=d['report']
          assert r['status']=='M9_SPECIFIC_TWO_CALLBACK_VPTR_BASE_PROBE'
          assert r['exact_known_callback_pointer_slots_verified']==2
          assert len(d['derived_address_point_hypotheses'])==2
          assert [x['hypothesized_vptr'] for x in d['derived_address_point_hypotheses']]==[0x32fde00,0x32fdf00]
          assert all(x['callback_at_derived_vptr_plus_0x38_exact'] for x in d['derived_address_point_hypotheses'])
          assert r['confirmed_object_constructor_vptr_assignments']==0
          assert r['confirmed_specific_slot0x38_runtime_dispatch']==0
          assert r['new_M7_script_text_FKs']==0
          assert all(not x['proven_vptr'] for x in d['derived_address_point_hypotheses'])
          print('M9.19 source-address-point triage PASS')
          PY

      - name: Attach source byte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m9-19-owner-callback-vptr-base
          path: UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_callback_vptr_base_probes.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit bounded evidence on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_callback_vptr_base_probes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m9.19): source-verified callback vptr base candidates"
          for attempt in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
