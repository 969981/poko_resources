name: M20 - Original item fallback record provenance

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_item_fallback_provenance.py"
      - ".github/workflows/unpack-m20-item-fallback-provenance.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m20-fallback
  cancel-in-progress: false

jobs:
  exact-fallback-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_item_fallback_provenance.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSO decompression dependency
        run: python -m pip install "lz4>=4,<5"
      - name: Validate exact 68-byte source matching, reject forged originals
        run: python -m Scripts.resources.trace_native_item_fallback_provenance --self-test
      - name: Recover fallback pointer bytes and compare with decoded original item records
        run: python -m Scripts.resources.trace_native_item_fallback_provenance
      - name: Verify audit source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20/item_fallback_source_audit.json").read_text(encoding="utf8"))
          assert r["original_main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert r["original_item_sha256"]=="2a2dbc88715dc76410cef495d418613456c0c4fa7b7d719e7b37709ad53e1b6f"
          assert r["item_rows"]==4600 and r["item_stride"]==68
          assert not r["fallback_pointer_is_proven_item_record"]
          assert not r["V2_getter_0x30_source_proven"]
          assert not r["item_type_enum_proven"]
          print("PASS exact original source and conservative identity flags")
          PY
      - name: Commit reproducible original source comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m20): original item fallback pointer and record byte comparison"
          for n in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
