name: M20 - Original species-hash xrefs and two-stage item callers

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m20_native_species_item_targets.py"
      - ".github/workflows/unpack-m20-native-species-item-targets.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m20-native-species-item-targets
  cancel-in-progress: false

jobs:
  analyze-original-exefs-and-native-items:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M19/m19_verified_texture_object_edges.csv
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSO decoder and AArch64 disassembler
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Verify fail-closed guards and branch encodings
        run: python -m Scripts.resources.m20_native_species_item_targets --self-test
      - name: Locate native property-hash sites and item-query callers
        run: python -m Scripts.resources.m20_native_species_item_targets
      - name: Reject unproven original identities and material classifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/m20_original_property_hash_sites.json")
          i=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20/m20_two_stage_item_callers.json")
          species=json.loads(p.read_text(encoding="utf-8"))
          items=json.loads(i.read_text(encoding="utf-8"))
          assert species["typed_edge_corpus_size"]==603
          assert species["species_id_bindings_verified"]==0
          assert not species["native_property_consumer_verified"]
          assert items["two_stage_wrapper_pc"]=="0x2f1f0"
          assert not items["v1_concrete_class_verified"]
          assert not items["v2_concrete_class_verified"]
          assert not items["returned_record_to_00983_verified"]
          assert not items["material_type_enum_verified"]
          print("PASS exact original sources and no unsourced species/material enum promotion")
          PY
      - name: Upload M20 native provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-201-m20-native-property-and-item-callers
          path: |
            UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20/
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20/
          if-no-files-found: error
      - name: Commit evidence to 2.0.1_unpack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Pokemon/NativeCallers/M20 UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M20
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m20): record original property-hash and two-stage call graph"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
