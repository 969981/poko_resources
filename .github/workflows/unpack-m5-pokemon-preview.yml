name: M5 - Preview Native Pokemon G1T Icon Layouts

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/preview_pokemon_icons.py"
      - "UnPack/2.0.1/Resources/Pokemon/pokemon_sample_manifest.csv"
      - ".github/workflows/unpack-m5-pokemon-preview.yml"

permissions:
  contents: read

concurrency:
  group: pokopia-m5-pokemon-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-pokemon-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/g1t_to_png.py
            Scripts/resources/crop_native_item_atlas.py
            Scripts/resources/preview_pokemon_icons.py
            UnPack/2.0.1/Resources/Pokemon/pokemon_sample_manifest.csv
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native/root_000204_00de13ed.texinfo
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native/root_050731_d58f20b8.g1t
