      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native G1T image decoder
        run: python -m pip install "Pillow>=11,<13"

      - name: Decode sixteen source-linked Pokemon G1Ts as swizzle candidates
        run: python -m Scripts.resources.preview_pokemon_icons

      - name: Check candidate images and contact sheet
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          from PIL import Image
          folder=Path("UnPack/2.0.1/Resources/Pokemon/Previews")
          summary=json.loads((folder/"summary.json").read_text(encoding="utf-8"))
          assert summary["sample_count"]==16
          assert summary["candidate_pngs"]>0
          with (folder/"pokemon_sample_manifest.csv").open(encoding="utf-8",newline="") as f:
              records=list(csv.DictReader(f))
          for record in records:
              if record["status"]!="UNVERIFIED_PNG_CANDIDATE": continue
              with Image.open(record["png"]) as im:
                  assert im.format=="PNG"
                  im.verify()
          with Image.open(folder/"pokemon_layout_contact_sheet.png") as sheet:
              assert sheet.width>=800 and sheet.height>=2000
              sheet.verify()
          print(summary)
          PY

      - name: Upload 16 native Pokemon layout candidates for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-2.0.1-pokemon-native-layout-candidates
          path: UnPack/2.0.1/Resources/Pokemon/Previews/
          retention-days: 14
          if-no-files-found: warn
