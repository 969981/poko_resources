name: M28.2 - Original AArch64 33h-minus-2h hash31 candidates

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m28_2_native_33_minus_2_hash31.py"
      - ".github/workflows/unpack-m28-2-33-minus-2-hash31.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m28-2-hash31-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-original-33-minus-2-hash-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sparse checkout original NSO source and hash opcode parsers
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m20_native_species_item_targets.py
            Scripts/resources/m28_original_nso_31_arithmetic_candidates.py
            Scripts/resources/m28_2_native_33_minus_2_hash31.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original NSO instruction parser
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Test 33h minus 2h bit masks and exact arithmetic
        run: python -m Scripts.resources.m28_2_native_33_minus_2_hash31 --self-test

      - name: Analyze every native same-source ADD LSL 5 and SUB LSL 1 chain
        run: python -m Scripts.resources.m28_2_native_33_minus_2_hash31

      - name: Confirm original byte evidence and retain unknown runtime identity
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M28")
          s=json.loads((p/"m28_2_33minus2_source_summary.json").read_text(encoding="utf-8"))
          d=json.loads((p/"m28_2_33minus2_byte_chain_dossier.json").read_text(encoding="utf-8"))
          with (p/"m28_2_native_shift5_same_source_survey.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert s["original_main_sha256"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert len(rows)==s["native_32_bit_same_source_ADD_LSL5_count"]
          assert len(d["candidate_chains"])==s["saved_original_asm_windows"]
          assert s["native_33h_minus_2h_local_pattern_count"]>=s["exact_adjacent_33h_minus_2h_31h_expression_count"]
          assert not s["native_string_hash31_implementation_proven"]
          assert not s["native_kids_registry_key_lookup_proven"]
          assert not s["native_species_ID_to_original_array_slot_proven"]
          assert all(not r["native_hash_function_verified"] and
              not r["native_kids_query_consumer_verified"] and
              not r["native_species_ID_verified"] for r in rows)
          print("M28.2 source arithmetic forms verified with no invented gameplay ID.")
          PY

      - name: Upload bounded exact arithmetic candidate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m28-2-original-33minus2-hash31-opcode-dossier
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M28/m28_2_*
          if-no-files-found: warn

      - name: Commit original machine-code evidence reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M28/m28_2_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m28.2): scoped native 33h-minus-2h opcode evidence on original NSO"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
