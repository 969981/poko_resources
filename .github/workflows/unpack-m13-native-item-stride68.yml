name: M13 - Trace native 68-byte item record multiply-address candidates

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/trace_native_item_stride68.py"
      - ".github/workflows/unpack-m13-native-item-stride68.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-201-m13-68-stride
  cancel-in-progress: false

jobs:
  native-record-stride:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            UnPack/2.0.1/romfs/LD_C0_R.BIN/decoded/00983.bin
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/trace_native_item_stride68.py
            UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"
      - name: Verify UMADDL, record offset and fail-closed source tests
        run: python -m Scripts.resources.trace_native_item_stride68 --self-test
      - name: Inspect original NSO and original 4600 × 68 table
        run: python -m Scripts.resources.trace_native_item_stride68
      - name: Check no false claim of original table provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M13/native_stride68_candidates.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          assert a["sha256_main"]=="8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
          assert a["sha256_item"]=="2a2dbc88715dc76410cef495d418613456c0c4fa7b7d719e7b37709ad53e1b6f"
          assert a["item_count"]==4600 and a["item_stride"]==68
          assert a["verified_00983_loader"] is False
          assert a["verified_item_ID_times_68_base"] is False
          print("PASS: candidate-only original executable records")
          PY
      - name: Commit reproducible static evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -- UnPack/2.0.1/Resources/Items/Native_2.0.1/ExeFS/M13
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m13): original UMADDL/MADD stride68 static candidates"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
            sleep 2
          done
          exit 1
