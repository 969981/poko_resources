name: M25.9 - Nine ambiguous villager native array slot dossier

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m25_9_nine_ambiguous_registry_dossier.py"
      - ".github/workflows/unpack-m25-9-ambiguous-array-slots.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m25-9-ambiguous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-original-nine-variant-array-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original array registry and nine native source groups
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/m25_9_nine_ambiguous_registry_dossier.py
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M22/m22_nine_ambiguous_native_object_refs.csv
            UnPack/2.0.1/Resources/Pokemon/NativeRecoveryM25/m25_8_complete_native_629_kids_icon_source_index.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Join all 54 source-qualified candidates to the original KIDS source slot
        run: python -m Scripts.resources.m25_9_nine_ambiguous_registry_dossier

      - name: Validate full nine-group candidate evidence without assigning IDs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25")
          s=json.loads((p/"m25_9_ambiguous_slot_summary.json").read_text(encoding="utf-8"))
          rows=list(csv.DictReader((p/"m25_9_nine_ambiguous_native_array_slot_dossier.csv").open(encoding="utf-8",newline="")))
          assert len(rows)==s["source_oid_to_original_array_slot_links_verified"]==54
          assert len(s["unresolved_ambiguous_pokohex_portrait_ids"])==9
          assert all(r["source_oid"] and r["target_texture_oid"] and r["original_icon_array_index"] for r in rows)
          assert all(not r["native_identity_binding_verified"] for r in rows)
          assert s["native_runtime_villager_id_bindings_verified"]==0
          print("M25.9 all 54 native source slot references verified")
          PY

      - name: Commit audit of unresolved original NPC identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M25/m25_9_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m25.9): 9 ambiguous portraits with 54 exact native KIDS array slots"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
