name: One-shot prune already-integrated Pokopia unpack branches
on:
  push:
    branches: [2.0.1_unpack]
    paths:
      - .github/workflows/one-shot-prune-unpack-branches.yml
permissions:
  contents: write
concurrency:
  group: pokopia-one-shot-prune-2-0-1
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prune the newly-created fully merged branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feature/pokopia-binary-m10-evidence-graph"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            ahead="$(gh api "repos/$GH_REPO/compare/2.0.1_unpack...$branch" --jq '.ahead_by')"
            if [[ "$ahead" != "0" ]]; then
              echo "REFUSED: the newly created branch has unmerged work ($ahead commits)"
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted verified fully merged branch $branch"
          fi
          remaining="$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' '2.0.1_unpack' 'main' | sort)"
          if [[ "$remaining" != "$expected" ]]; then
            echo "Unexpected branches remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi
          echo "SUCCESS: only main and 2.0.1_unpack remain"
      - name: Remove temporary cleanup workflow
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path=".github/workflows/one-shot-prune-unpack-branches.yml"
          sha="$(gh api "repos/$GH_REPO/contents/$path?ref=2.0.1_unpack" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$sha" ]]; then
            gh api --method DELETE "repos/$GH_REPO/contents/$path" -f message="chore: remove one-shot branch cleanup workflow [skip ci]" -f sha="$sha" -f branch="2.0.1_unpack"
          fi
