name: M9.21 - complete exact owner callback bodies across jump tables

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m9_owner_complete_callbacks.py"
      - "tests/test_m9_owner_complete_callbacks.py"
      - ".github/workflows/unpack-m9-owner-complete-callbacks.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m9-21-owner-complete-callbacks
  cancel-in-progress: false

jobs:
  native-callback-body-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            2.0.1/exefs/main
            Scripts/resources/trace_native_species_item_callers.py
            Scripts/resources/m9_owner_object_escape.py
            Scripts/resources/m9_owner_complete_callbacks.py
            tests/test_m9_owner_complete_callbacks.py
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_sibling_callback_consumers.json
            UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_complete_callback_control_flow.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "lz4>=4,<5" "capstone>=5,<6"

      - name: Test complete callback body and computed jump parsing
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_m9_owner_complete_callbacks.py' -v

      - name: Verify full original native callback bodies
        env:
          PYTHONPATH: "."
        run: |
          python Scripts/resources/m9_owner_complete_callbacks.py \
            --main 2.0.1/exefs/main \
            --m9-20 UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_sibling_callback_consumers.json \
            --dest UnPack/2.0.1/Resources/Localization/M9/NameTables

      - name: Strict verified original callback body and evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_complete_callback_control_flow.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=d['report']
          assert r['status']=='M9_COMPLETE_BOUNDED_OWNER_CALLBACK_BODIES'
          assert r['exact_callback_functions_fully_decoded']==4
          assert all(x['complete_original_linear_instructions_verified'] for x in d['methods'])
          assert r['native_instructions_decoded']==sum(len(x['native_instructions']) for x in d['methods'])
          assert r['exact_inner_object_vptr_callback_runtime_dispatch_proven']==0
          assert r['verified_script_to_M7_foreign_keys']==0
          s=next(x for x in d['methods'] if x['name']=='constructor_sibling')
          assert any(x['pc']==0xd59310 for x in s['owner_plus_0x28_reads'])
          print('M9.21 full native method ranges PASS')
          PY

      - name: Save original instruction windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m9-21-owner-full-callbacks
          path: UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_complete_callback_control_flow.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit strict disassembly evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- UnPack/2.0.1/Resources/Localization/M9/NameTables/exefs_owner_complete_callback_control_flow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(m9.21): full native owner callback bodies and computed branch edges"
          for attempt in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
