name: Publish Pokopia 2.0.1 additional FDATA records

on:
  push:
    branches: [2.0.1_unpack]
    paths:
      - '.github/workflows/publish-unpack-phase2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokopia-unpack-publish-2-0-1
  cancel-in-progress: false

jobs:
  additional-fdata:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Sparse checkout original FDATA, RDB indexes and publisher
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/
            tests/
            UnPack/2.0.1/
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/root.rdb
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/root.rdx
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/system.rdb
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/system.rdx
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x57e5b452.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0x0017d6e2.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xcebd4bd4.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xe1d3773b.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xe80c0628.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xe8fc91c2.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xed675d0e.fdata
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata.7z.*
            2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2/0xc884bce7.fdata.7z.*
      - name: Install 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends 7zip
      - name: Test publisher
        run: python3 -m unittest discover -s tests -v
      - name: Publish all remaining direct FDATA
        run: |
          python3 -m Scripts.unpack.publish --kind ktrdb \
            --output UnPack/2.0.1 --max-file-mib 90 --max-total-mib 600 \
            --only-fdata 57e5b452 --only-fdata 0017d6e2 \
            --only-fdata cebd4bd4 --only-fdata e1d3773b \
            --only-fdata e80c0628 --only-fdata e8fc91c2 \
            --only-fdata ed675d0e
      - name: Restore 0x00011c54.fdata
        run: |
          src=2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE
          7z t -y "$src/0x00011c54.fdata.7z.001"
          7z x -y "$src/0x00011c54.fdata.7z.001" "-o$src"
          test -s "$src/0x00011c54.fdata"
      - name: Publish 0x00011c54.fdata
        run: |
          python3 -m Scripts.unpack.publish --kind ktrdb \
            --output UnPack/2.0.1 --max-file-mib 90 --max-total-mib 600 \
            --only-fdata 00011c54
      - name: Restore 0xc884bce7.fdata
        run: |
          src=2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/MountPoint_2
          7z t -y "$src/0xc884bce7.fdata.7z.001"
          7z x -y "$src/0xc884bce7.fdata.7z.001" "-o$src"
          test -s "$src/0xc884bce7.fdata"
      - name: Publish 0xc884bce7.fdata
        run: |
          python3 -m Scripts.unpack.publish --kind ktrdb \
            --output UnPack/2.0.1 --max-file-mib 90 --max-total-mib 600 \
            --only-fdata c884bce7
      - name: Commit additional resources to requested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f -- UnPack/2.0.1/romfs UnPack/2.0.1/_reports
          if git diff --cached --quiet; then
            echo "No new decoded output"
            exit 0
          fi
          git diff --cached --stat | tail -n 25
          git commit -m "data(unpack): publish additional direct and split FDATA [skip ci]"
          git push origin HEAD:2.0.1_unpack
