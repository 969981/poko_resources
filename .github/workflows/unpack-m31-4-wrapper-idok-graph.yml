name: M31.4 - Verify all original 628 wrapper IDOK typed objects

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/m31_4_wrapper_idok_typed_graph.py"
      - ".github/workflows/unpack-m31-4-wrapper-idok-graph.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m31-4-original-wrapper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-original-native-wrapper-object-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source-qualified KIDS binary, M31.3 index and graph extractor
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0xacd220a8.fdata/native/root_019167_50ae86ef.kidsobjdb
            UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_3_corrected_628_native_texture_object_fields.csv
            Scripts/resources/m16_verify_pokemon_texture_kidsobjdb.py
            Scripts/resources/m31_4_wrapper_idok_typed_graph.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest KIDS wrapper-to-field graph schema
        run: python -m Scripts.resources.m31_4_wrapper_idok_typed_graph --self-test

      - name: Traverse original 628 wrapper IDOKs and typed fields
        run: python -m Scripts.resources.m31_4_wrapper_idok_typed_graph

      - name: Fail closed on unproven wrapper class or species identity
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31")
          s=json.loads((p/"m31_4_original_wrapper_IDOK_typed_graph_summary.json").read_text(encoding="utf-8"))
          with (p/"m31_4_original_628_wrapper_IDOK_typed_field_graph.csv").open(
              encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert s["original_kids_source_sha256"]=="86f90b4c11da9bc2b3e28889a5090ff507f96ca713fe4fad1dd50f6f692d7541"
          assert s["source_to_real_wrapper_IDOK_edges"]==628
          assert s["unique_original_wrapper_IDOK_objects"]==628
          assert s["original_idok_object_count"]==7087
          assert len(rows)==s["wrapper_field_rows_written"]
          assert len({r["original_wrap_object_hash"] for r in rows})==628
          assert s["wrapper_property_type_name_from_original_ExeFS_verified"]
          assert s["wrapper_property_original_type_name"]=="StaticScreenLayoutTextures"
          assert s["source_and_wrapper_both_original_class_0x79991e79"]
          assert s["source_wrapper_raw_fields_link_to_M25_G1T_TEXINFO_hashes_proven"]
          assert s["wrapper_scalar_matches_legacy_g1t_file_hash"]==628
          assert s["wrapper_scalar_matches_legacy_texinfo_file_hash"]==628
          assert not s["runtime_game_entity_to_wrapper_source_ID_verified"]
          assert not s["native_species_form_ID_to_Source_OID_verified"]
          assert all(not r["native_game_species_id_verified"] for r in rows)
          print("PASS all 628 wrapper objects and their source-qualified IDOK typed field edges")
          PY

      - name: Upload 628 wrapper graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-m31-4-native-628-verified-wrapper-IDOK-field-graph
          path: UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_4_*
          if-no-files-found: warn

      - name: Commit source-byte verified wrapper graph results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Villagers/Native_2.0.1/M31/m31_4_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(m31.4): 628 original wrapper object type and field edge graph"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
