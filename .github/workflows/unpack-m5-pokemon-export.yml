name: M5 - Export All 609 Native Pokemon Icon Candidates

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/export_native_pokemon_icons.py"
      - ".github/workflows/unpack-m5-pokemon-export.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m5-export-pokemon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-pokemon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout scripts and 609-entry source index only
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/resources/g1t_to_png.py
            Scripts/resources/crop_native_item_atlas.py
            Scripts/resources/export_native_pokemon_icons.py
            UnPack/2.0.1/Resources/Pokemon/pokemon_texture_index.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand sparse checkout to exact original G1T and TEXINFO inputs
        run: |
          git ls-tree -r --name-only HEAD -- UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native > /tmp/pokemon-native-tree.txt
          python - <<'PY'
          import csv
          from pathlib import Path
          index=Path("UnPack/2.0.1/Resources/Pokemon/pokemon_texture_index.csv")
          with index.open(encoding="utf-8-sig",newline="") as f:
              data=list(csv.DictReader(f))
          assert len(data)==609
          root="UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native/"
          allfiles=set(Path("/tmp/pokemon-native-tree.txt").read_text().splitlines())
          paths=set([
            "Scripts/resources/g1t_to_png.py",
            "Scripts/resources/crop_native_item_atlas.py",
            "Scripts/resources/export_native_pokemon_icons.py",
            "UnPack/2.0.1/Resources/Pokemon/pokemon_texture_index.csv",
          ])
          for r in data:
              assert r["status"]=="PHYSICAL_G1T_PRESENT" and r["g1t_filename"],r
              for filename in (r["g1t_filename"],r["texinfo_filename"]):
                  path=root+filename
                  if path not in allfiles:
                      raise ValueError(f"Original source missing from Git tree: {path}")
                  paths.add(path)
          Path("/tmp/pokemon-sparse.txt").write_text("\n".join(sorted(paths))+"\n")
          print("Selected exact original inputs:",len(paths),"for",len(data),"source records")
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/pokemon-sparse.txt

      - name: Install Pillow with native BC7 DDS support
        run: python -m pip install "Pillow>=11,<13"

      - name: Decode all original G1T records and source-linked TEXINFO crops
        run: python -m Scripts.resources.export_native_pokemon_icons

      - name: Validate source ledger, duplicate names and image integrity
        run: |
          python - <<'PY'
          import csv,json,hashlib
          from collections import Counter
          from pathlib import Path
          from PIL import Image
          root=Path("UnPack/2.0.1/Resources/Pokemon/NativeCandidates")
          s=json.loads((root/"pokemon_native_summary.json").read_text(encoding="utf-8"))
          with (root/"pokemon_native_manifest.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==609,s
          assert s["source_rows"]==609 and s["name_distinct"]==603,s
          assert s["native_png_candidates"]==609,s
          assert s["candidate_by_category"]=={"pokemon":301,"pokemon_uni":308},s
          assert s["source_recovery_kinds"]=={
              "ORIGINAL_NATIVE_G1T":580,
              "RECOVERED_DECODED_BLOB_ALIAS":29
          },s
          assert len({r["png_path"] for r in rows})==609
          assert len({r["texture_name"] for r in rows})==603
          assert sum(r["texture_name"]=="icon_poke_at_home" for r in rows)==1
          for row in rows:
              assert row["status"] in ("PNG_CANDIDATE_UNVERIFIED","TRANSPARENT_CANDIDATE_REVIEW"),row
              p=Path(row["png_path"])
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==row["png_sha256"],row
              with Image.open(p) as image:
                  assert image.format=="PNG" and image.size==(int(row["crop_width"]),int(row["crop_height"])),row
                  image.verify()
          for name in ("contact_sheet_pokemon.png","contact_sheet_pokemon_uni.png"):
              with Image.open(root/name) as image:
                  assert image.width>=1000 and image.height>=1000
                  image.verify()
          print("609 original-source icon PNGs passed image + hash checks")
          print("Candidate statuses:",s["statuses"])
          PY

      - name: Upload all extracted Pokémon PNG candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokopia-2.0.1-609-source-pokemon-png-candidates
          path: UnPack/2.0.1/Resources/Pokemon/NativeCandidates/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit 609 original-source candidate PNGs (never overwrite imported images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A -- UnPack/2.0.1/Resources/Pokemon/NativeCandidates
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data(m5): extract 609 native Pokémon PNG candidates with TEXINFO/G1T provenance"
          for try in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
