name: M5 - Pokopia G1T BC7 preview and TEXINFO index

on:
  workflow_dispatch:
  push:
    branches: ["2.0.1_unpack"]
    paths:
      - "Scripts/resources/g1t_to_png.py"
      - "tests/test_g1t_to_png.py"
      - ".github/workflows/unpack-m5-textures.yml"

permissions:
  contents: write

concurrency:
  group: pokopia-m5-textures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch with a narrow RomFS sample
        uses: actions/checkout@v4
        with:
          ref: 2.0.1_unpack
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout: |
            Scripts
            tests
            UnPack/2.0.1/Resources/Textures
            UnPack/2.0.1/Resources/Items/item_catalog.csv
            UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BC7 image decoder
        run: python -m pip install "Pillow>=11,<13"

      - name: Unit test parser and BC7 PNG decoding
        run: python -m unittest discover -s tests -p "test_g1t_to_png.py" -v

      - name: Decode small real Pokopia G1T files as layout candidates
        run: |
          BASE="UnPack/2.0.1/romfs/motor_asset_re/KIDS_PLATFORM_OUNCE/0x00011c54.fdata/native"
          python Scripts/resources/g1t_to_png.py \
            --input "$BASE/root_000333_016719f3.g1t" \
            --input "$BASE/root_000613_0280192f.g1t" \
            --input "$BASE/root_000024_001e0cad.g1t" \
            --texinfo-root "$BASE" \
            --layouts "linear,gob1,gob2" \
            --dest "UnPack/2.0.1/Resources"

      - name: Correlate original TEXINFO atlas UVs with indexed KIDSOBJDB/G1T edges
        run: python Scripts/resources/link_item_textures.py

      - name: Assert multi-record TEXINFO discovery and retain cautious evidence status
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          base = Path("UnPack/2.0.1/Resources/Textures")
          with (base / "texinfo_names.csv").open(encoding="utf-8", newline="") as f:
              names = list(csv.DictReader(f))
          atlas = [r for r in names if r["texture_name"] == "item_0006"
                   and r["record_count"] == "1333"]
          assert len(atlas) == 1, "1,333-entry native TEXINFO atlas was not parsed"
          assert atlas[0]["uv_status"] == "RECT_OK", "atlas UV format invalid"
          report = json.loads((base / "Indexes/item_native_texture_audit.json").read_text(encoding="utf-8"))
          assert report["index_edges"] == 3229, report
          assert report["texinfo_record_matches"] >= 2600, report
          print("Native TEXINFO atlas rows:", len(names))
          print("Native item TEXTINFO+KIDSOBJDB index links:", report["texinfo_record_matches"])
          PY

      - name: Check actual images and data rows
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from PIL import Image
          base = Path("UnPack/2.0.1/Resources/Textures")
          with (base / "texture_manifest.csv").open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          good = [r for r in rows if r["status"] == "DECODED_UNVERIFIED"]
          if not good:
              raise SystemExit("No real PNG candidates decoded")
          for r in good:
              path = Path(r["png_path"])
              with Image.open(path) as img:
                  img.verify()
          with (base / "texinfo_names.csv").open(encoding="utf-8", newline="") as f:
              names = list(csv.DictReader(f))
          assert any(r["texture_name"].startswith("item_") for r in names), "item TEXINFO missing"
          print(f"PNG decoded (not visually verified): {len(good)}, TEXINFO indexed: {len(names)}")
          PY

      - name: Commit labelled candidates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- UnPack/2.0.1/Resources/Textures
          if git diff --cached --quiet; then
            echo "No changed M5 output"
            exit 0
          fi
          git commit -m "data(m5): add unverified G1T layout PNG previews and TEXINFO names"
          for i in 1 2 3; do
            if git push origin HEAD:2.0.1_unpack; then exit 0; fi
            git fetch origin 2.0.1_unpack
            git rebase origin/2.0.1_unpack
          done
          exit 1
